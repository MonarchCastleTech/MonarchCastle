name: Verify and deploy SRTI Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Test and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "Sahel Region Threat Index (SRTI)/requirements.txt"

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r "Sahel Region Threat Index (SRTI)/requirements.txt"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify generated pages are current
        run: |
          python -c "import generate_pages as gp; gp.generate_srti_page()"
          git diff --exit-code -- index.html "Sahel Region Threat Index (SRTI)/index.html"

      - name: Validate snapshot contract
        run: python scripts/validate_srti.py

  deploy:
    name: Deploy and check
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build minimal Pages artifact
        run: python scripts/build_pages.py

      - name: Pre-deploy HTTP health check
        run: |
          python -m http.server 8000 --directory .pages-artifact >/tmp/srti-pages.log 2>&1 &
          python scripts/smoke_pages.py http://127.0.0.1:8000/

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .pages-artifact

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Post-deploy HTTP health check
        run: python scripts/smoke_pages.py "${{ steps.deployment.outputs.page_url }}"
