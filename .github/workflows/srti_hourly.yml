name: Update SRTI snapshot

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  update:
    name: Collect, gate, and publish artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: srti-update
      cancel-in-progress: false
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Reconcile queued repository changes
        run: git pull --rebase origin main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "Sahel Region Threat Index (SRTI)/requirements.txt"

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r "Sahel Region Threat Index (SRTI)/requirements.txt"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect public sources
        run: python "Sahel Region Threat Index (SRTI)/sahel_watch.py"

      - name: Generate static operator page
        run: python -c "import generate_pages as gp; gp.generate_srti_page()"

      - name: Validate last-known-good contract
        run: |
          python scripts/validate_srti.py
          git diff --check

      - name: Build and test Pages artifact
        run: |
          python scripts/build_pages.py
          python -m http.server 8000 --directory .pages-artifact >/tmp/srti-pages.log 2>&1 &
          python scripts/smoke_pages.py http://127.0.0.1:8000/

      - name: Commit accepted snapshot
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git config user.name "monarchcastle-srti-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              "data/srti_latest.json" \
              "data/srti_history.json" \
              "Sahel Region Threat Index (SRTI)/sahel_data.csv" \
              "Sahel Region Threat Index (SRTI)/index.html" \
              "index.html"
            git commit -m "Update accepted SRTI snapshot"
            git push origin HEAD:main
          else
            echo "No accepted snapshot changes."
          fi

      - name: Upload verified site for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: srti-pages-${{ github.run_id }}
          path: .pages-artifact
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy and check
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout health script
        uses: actions/checkout@v4

      - name: Download verified site
        uses: actions/download-artifact@v4
        with:
          name: srti-pages-${{ github.run_id }}
          path: .pages-artifact

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-artifact

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post-deploy HTTP health check
        run: python scripts/smoke_pages.py "${{ steps.deployment.outputs.page_url }}"
